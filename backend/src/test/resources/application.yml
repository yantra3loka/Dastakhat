spring:
  datasource:
    # The Testcontainers JDBC driver starts a PostgreSQL 16 container on demand and reuses it
    # for the whole test run. The database is the same one that is used in production.
    url: jdbc:tc:postgresql:16:///dastakhat
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP_UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          timeout: 5000
          connectiontimeout: 5000
          writetimeout: 5000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  servlet:
    session:
      cookie:
        name: DASTAKHAT_SESSION
        http-only: true
        same-site: lax

dastakhat:
  storage-dir: ./target/test-storage
  cors-origins: http://localhost:5173
  public-base-url: http://localhost:5173
  default-link-expiry-days: 7
  cookie-secure: false
  seal-keystore: ./target/test-pki/platform-seal.p12
  seal-keystore-password: changeit
  seal-certificate: ./target/test-pki/platform-seal-cert.pem
  trust-roots: ./target/test-pki/test-root-ca.pem
  mock-esp-base-url: http://localhost:9100
  esign-callback-url: http://localhost:8080/api/v1/esign/callback
  seed:
    enabled: true
    email: sender@example.test
    name: Dastakhat Sender
    password: ChangeMe!123

logging:
  level:
    root: WARN
    com.dastakhat: INFO
    org.springframework: WARN
    org.testcontainers: INFO
