name: Dastakhat CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java, Testcontainers PostgreSQL, Mailpit)
    runs-on: ubuntu-latest
    # The integration tests start their own PostgreSQL 16 through Testcontainers
    # (jdbc:tc:...); only Mailpit has to be provided by the runner.
    services:
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      - name: Compile
        run: mvn -B -f backend/pom.xml verify -DskipTests

      - name: Test
        run: mvn -B -f backend/pom.xml test
        env:
          MAIL_HOST: localhost
          MAIL_PORT: 1025

      - name: Build the MOCK eSign provider
        run: mvn -B -f backend/pom.xml install -DskipTests && mvn -B -f mock-esp/pom.xml package -DskipTests

      - name: Check that no secret was committed
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  frontend:
    name: Frontend (Vue 3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --prefix frontend

      - name: Type check and build
        run: npm run build --prefix frontend

      - name: Unit tests
        run: npm run test --prefix frontend

  e2e:
    name: End to end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dastakhat
          POSTGRES_USER: dastakhat
          POSTGRES_PASSWORD: dastakhat-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dastakhat"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the dependencies
        run: |
          npm ci --prefix frontend
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Build the backend and the frontend
        run: |
          mvn -B -f backend/pom.xml package -DskipTests
          npm run build --prefix frontend

      - name: Create the TEST certificates
        run: >
          mvn -B -q -f backend/pom.xml exec:java
          -Dexec.mainClass=com.dastakhat.devpki.DevPkiTool
          -Dexec.args="all ${{ github.workspace }}/devpki/out"

      - name: Start the backend
        env:
          DB_PASSWORD: dastakhat-ci
        run: |
          nohup java -jar backend/target/dastakhat-backend-1.0.0-exec.jar \
            --server.port=8080 \
            --dastakhat.storage-dir=${{ runner.temp }}/storage \
            --dastakhat.public-base-url=http://localhost:5173 \
            --dastakhat.cors-origins=http://localhost:5173 \
            --dastakhat.esign-callback-url=http://localhost:8080/api/v1/esign/callback \
            --dastakhat.seal-keystore=devpki/out/platform-seal.p12 \
            --dastakhat.seal-certificate=devpki/out/platform-seal-cert.pem \
            --dastakhat.trust-roots=devpki/out/test-root-ca.pem \
            > backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/v1/health > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://localhost:8080/api/v1/health

      - name: Start the frontend
        run: |
          nohup npm --prefix frontend run dev > frontend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173 > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://localhost:5173 > /dev/null

      - name: Run the end to end tests
        run: npx playwright test --config e2e/playwright.config.ts
        env:
          DASTAKHAT_NO_WEBSERVER: 'true'
          DASTAKHAT_FRONTEND_URL: http://localhost:5173

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/artifacts
          retention-days: 7
